<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KI-Assistent</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ===================================================== */
  /*  HIER ANPASSEN: Farbe                                  */
  /* ===================================================== */
  :root { --accent:#126E63; --accent-deep:#0E5249; }

  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Hanken Grotesk',system-ui,sans-serif;color:#1A1A1A;background:#FAFAF8;height:100vh;display:flex;flex-direction:column}
  header{border-bottom:1px solid #EAE9E3;padding:14px 20px;display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
  .title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px;line-height:1}
  .subtitle{font-size:12.5px;color:#8A887F;margin-top:3px}
  main{flex:1;overflow-y:auto}
  .wrap{max-width:720px;margin:0 auto;padding:28px 20px}
  .empty{text-align:center;padding-top:8vh}
  .empty .big{width:60px;height:60px;border-radius:18px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 20px}
  .empty h1{font-family:'Bricolage Grotesque',sans-serif;font-size:28px;font-weight:700;margin-bottom:28px}
  .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:520px;margin:0 auto}
  .chip{font-size:14px;padding:10px 16px;border-radius:999px;border:1px solid #E1E0DA;background:#fff;color:#4A4843;cursor:pointer;font-family:inherit;transition:all .15s}
  .chip:hover{border-color:var(--accent);color:var(--accent-deep);transform:translateY(-1px)}
  .row{display:flex;margin-bottom:16px;animation:f .35s ease both}
  .row.user{justify-content:flex-end}
  .bubble{max-width:85%;padding:13px 17px;font-size:15px;line-height:1.55;white-space:pre-wrap}
  .bubble.bot{background:#fff;border:1px solid #EAE9E3;border-radius:18px 18px 18px 5px}
  .bubble.user{background:var(--accent);color:#fff;border-radius:18px 18px 5px 18px}
  @keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin:0 2px;animation:b 1.2s infinite ease-in-out}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-5px)}}
  footer{border-top:1px solid #EAE9E3;padding:16px 20px}
  .inwrap{max-width:720px;margin:0 auto}
  .inbar{display:flex;gap:8px;align-items:flex-end;background:#fff;border:1px solid #E1E0DA;border-radius:18px;padding:8px 8px 8px 16px}
  textarea{flex:1;resize:none;border:none;outline:none;font-size:15px;font-family:inherit;background:transparent;max-height:140px;padding:8px 0}
  .send{width:40px;height:40px;border-radius:12px;border:none;background:#DDDCD5;color:#fff;cursor:pointer;font-size:20px;flex-shrink:0;transition:background .15s}
  .send.on{background:var(--accent)}
  .foot{text-align:center;font-size:11.5px;color:#A8A69D;margin-top:10px}
</style>
</head>
<body>
  <header>
    <div class="logo">🤖</div>
    <div>
      <div class="title" id="cName"></div>
      <div class="subtitle" id="cSub"></div>
    </div>
  </header>

  <main id="main"><div class="wrap" id="list"></div></main>

  <footer>
    <div class="inwrap">
      <div class="inbar">
        <textarea id="input" rows="1" placeholder="Schreib deine Nachricht…"></textarea>
        <button class="send" id="send">↑</button>
      </div>
      <div class="foot">KI-Assistent · Antworten können Fehler enthalten</div>
    </div>
  </footer>

<script>
// =====================================================
//  HIER ANPASSEN: alle Texte & Infos
// =====================================================
const CONFIG = {
  name: "KI-Assistent",
  subtitle: "Stell mir deine Frage – ich helfe sofort weiter.",
  contactEmail: "support@deinedomain.de",
  intro: "Hallo! Wie kann ich dir helfen?",
  suggestions: [
    "Was bietet ihr an?",
    "Wie läuft eine Bestellung?",
    "Wie kann ich euch erreichen?",
    "Wie lange dauert es?",
  ],
  // Das ist die EINZIGE Wissensquelle des Bots – mit echten Infos füllen:
  knowledge: `
- Beschreibe hier euer Angebot.
- Ablauf / Lieferzeiten / Region.
- Preise / Kostenvoranschlag.
- Kontakt: support@deinedomain.de
`,
};

const SYSTEM_PROMPT =
`Du bist der freundliche KI-Assistent von "${CONFIG.name}".
WISSENSBASIS (einzige Informationsquelle):
${CONFIG.knowledge}
REGELN:
- Antworte IMMER auf Deutsch, freundlich, kurz (2–5 Sätze).
- Erfinde NIEMALS Fakten, Preise oder Termine, die nicht in der Wissensbasis stehen.
- Wenn du etwas nicht weißt, sag es ehrlich und verweise auf: ${CONFIG.contactEmail}.`;

// --- App ---
const $ = (id) => document.getElementById(id);
$("cName").textContent = CONFIG.name;
$("cSub").textContent = CONFIG.subtitle;

let messages = [];
let loading = false;

function render() {
  const list = $("list");
  if (messages.length === 0 && !loading) {
    list.className = "wrap";
    list.innerHTML =
      `<div class="empty"><div class="big">🤖</div><h1>${CONFIG.intro}</h1>
       <div class="chips">${CONFIG.suggestions
         .map((s) => `<button class="chip">${s}</button>`)
         .join("")}</div></div>`;
    [...list.querySelectorAll(".chip")].forEach((b, i) =>
      b.addEventListener("click", () => send(CONFIG.suggestions[i]))
    );
    return;
  }
  list.className = "wrap";
  list.innerHTML =
    messages
      .map(
        (m) =>
          `<div class="row ${m.role}"><div class="bubble ${
            m.role === "user" ? "user" : "bot"
          }">${escapeHtml(m.content)}</div></div>`
      )
      .join("") +
    (loading
      ? `<div class="row bot"><div class="bubble bot typing"><span></span><span></span><span></span></div></div>`
      : "");
  $("main").scrollTop = $("main").scrollHeight;
}

function escapeHtml(t) {
  const d = document.createElement("div");
  d.textContent = t;
  return d.innerHTML;
}

async function send(text) {
  const content = (text ?? $("input").value).trim();
  if (!content || loading) return;
  messages.push({ role: "user", content });
  $("input").value = "";
  loading = true;
  render();
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: messages.map((m) => ({ role: m.role, content: m.content })),
      }),
    });
    const data = await res.json();
    const reply = (data.content || [])
      .map((b) => (b.type === "text" ? b.text : ""))
      .join("")
      .trim();
    messages.push({
      role: "assistant",
      content: reply || `Entschuldige, da ist etwas schiefgelaufen. Schreib uns an ${CONFIG.contactEmail}.`,
    });
  } catch (e) {
    messages.push({
      role: "assistant",
      content: `Technisches Problem. Bitte erneut versuchen oder ${CONFIG.contactEmail} kontaktieren.`,
    });
  } finally {
    loading = false;
    render();
  }
}

$("send").addEventListener("click", () => send());
$("input").addEventListener("input", (e) => {
  $("send").classList.toggle("on", !!e.target.value.trim());
});
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
render();
</script>
</body>
</html>
